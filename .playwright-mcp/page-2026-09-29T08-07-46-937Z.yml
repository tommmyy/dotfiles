  - paragraph [ref=f1e87]:
    - strong [ref=f1e88]: Seznam alergenů
  - paragraph [ref=f1e89]:
    - text: "1. Obiloviny obsahující lepek, konkrétně: pšenice (například špalda a khorasan), žito, ječmen, oves nebo jejich hybridní odrůdy a výrobky z nich, kromě:"
    - emphasis [ref=f1e90]: a) glukózových sirupů na bázi pšenice, včetně dextrózy (1) b) maltodextrinů na bázi pšenice (1) c) glukózových sirupů na bázi ječmene d) obilovin použitých k výrobě alkoholických destilátů, včetně ethanolu zemědělského původu.
  - paragraph [ref=f1e91]: 2. Korýši a výrobky z nich
  - paragraph [ref=f1e92]: 3. Vejce a výrobky z nich
  - paragraph [ref=f1e93]:
    - text: "4. Ryby a výrobky z nich, kromě:"
    - emphasis [ref=f1e94]: a) rybí želatiny použité jako nosič vitaminových nebo karotenoidních přípravků b) rybí želatiny nebo vyziny použité jako čiřicí prostředek u piva a vína.
  - paragraph [ref=f1e95]: 5. Jádra podzemnice olejné (arašídy) a výrobky z nich
  - paragraph [ref=f1e96]:
    - text: "6. Sójové boby a výrobky z nich, kromě:"
    - emphasis [ref=f1e97]: a) zcela rafinovaného sójového oleje a tuku (1) b) přírodní směsi tokoferolů (E306), přírodního d–alfa tokoferolu, přírodního d–alfa–tokoferol–acetátu, přírodního d–alfa–tokoferol–sukcinátu ze sóji c) fytosterolů a esterů fytosterolů získaných z rostlinných olejů ze sóji d) esteru rostlinného stanolu vyrobeného ze sterolů z rostlinného oleje ze sóji
  - paragraph [ref=f1e98]:
    - text: "7. Mléko a výrobky z něj (včetně laktózy), kromě:"
    - emphasis [ref=f1e99]: a) syrovátky použité k výrobě alkoholických destilátů, včetně ethanolu zemědělského původu b) laktitolu
  - paragraph [ref=f1e100]: "8. Skořápkové plody, konkrétně: mandle (Amygdalus communis L.), lískové ořechy (Corylus avellana), vlašské ořechy (Juglans regia), kešu ořechy (Anacardium occidentale), pekanové ořechy (Carya illinoinensis (Wangenh.) K. Koch), para ořechy (Bertholletia excelsa), pistácie (Pistacia vera), makadamie (Macadamia ternifolia) a výrobky z nich, kromě ořechů použitých k výrobě alkoholických destilátů, včetně ethanolu zemědělského původu"
  - paragraph [ref=f1e101]: 9. Celer a výrobky z něj
  - paragraph [ref=f1e102]: 10. Hořčice a výrobky z ní
  - paragraph [ref=f1e103]: 11. Sezamová semena a výrobky z nich
  - paragraph [ref=f1e104]: 12. Oxid siřičitý a siřičitany v koncentracích vyšších než 10 mg/kg nebo 10 mg/l, vyjádřeno jako celkový SO2, které se propočítají pro výrobky určené k přímé spotřebě nebo ke spotřebě po rekonstituování podle pokynů výrobce
  - paragraph [ref=f1e105]: 13. Vlčí bob (lupina) a výrobky z něj
  - paragraph [ref=f1e106]: 14. Měkkýši a výrobky z nich
  - paragraph [ref=f1e107]: (1) A výrobky z nich, pokud zpracování, kterým prošly, nezvyšuje úroveň alergenicity, kterou úřad stanovil pro příslušný základní produkt.
