unbind-key C-b
set -g prefix 'C-\'
bind-key 'C-\' send-prefix

set-option -g status-position top
set-option -g allow-passthrough on
set-option -g default-command "reattach-to-user-namespace -l zsh"
# set -g default-command "reattach-to-user-namespace -l zsh"
# set -g default-shell "reattach-to-user-namespace -l zsh"

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
# bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# bind-key -T copy-mode-vi C-\ select-pane -l

# New window/split in current path by default.
#
# The workmux sidebar is a real tmux pane, and it is the ACTIVE pane right after
# it switches you into a session — so a bare #{pane_current_path} inherits the
# sidebar process's cwd (wherever `workmux sidebar on` was started, typically
# ~), not the worktree. Fall back to the session path whenever the active pane
# is the sidebar. #{E:...} is required: tmux 3.4 does not expand a user option
# recursively without it.
set -g @cwd_path '#{?#{==:#{pane_current_command},workmux},#{session_path},#{pane_current_path}}'

bind '"' split-window -c "#{E:@cwd_path}"
bind % split-window -h -c "#{E:@cwd_path}"
bind c new-window -c "#{E:@cwd_path}"
bind v new-window -c "#{E:@cwd_path}" \; send-keys "nvim ." Enter
bind o new-window -c "#{E:@cwd_path}" \; send-keys "opencode ." Enter
bind s choose-session

# https://gist.github.com/spicycode/1229612
# 0 is too far from ` ;)
set -g base-index 1

# Automatically set window title
set-window-option -g automatic-rename on
set-option -g set-titles on

#set -g default-terminal screen-256color
set -g status-keys vi
set -g history-limit 10000
# tmux-session-wizard names sessions after the leaf directory, which collides
# across git worktrees (sdp/s-analytics/sources vs sdp.feature-PER-842-.../
# s-analytics/sources both become "sources"). ~/.local/bin/t is a drop-in
# replacement with worktree-aware naming; let the plugin keep its own default
# key (T) so it cannot race this binding when tpm loads in the background.
set -g @session-wizard 'T'
bind t display-popup -w 90% -h 70% -E "$HOME/.local/bin/t"

setw -g mode-keys vi
setw -g mouse on
setw -g monitor-activity on

# bind-key v split-window -h
# bind-key s split-window -v

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
#bind h select-pane -L
#bind j select-pane -D
#bind k select-pane -U
#bind l select-pane -R

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes:w
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
# bind -n S-Left  previous-window
# bind -n S-Right next-window

# No delay for escape key press
set -sg escape-time 0

# Reload tmux config
bind r source-file ~/.tmux.conf

# source-file ~/airline-config.vimsnapshot

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin '27medkamal/tmux-session-wizard'

# Plugin setup performs several tmux subprocess calls; load it after the
# server accepts clients instead of blocking new terminal windows.
run-shell -b '~/.tmux/plugins/tpm/tpm'
